<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Sentinel Kiosk</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="kiosk.js" defer></script>
</head>

<body>
  <!-- ===================== VIDEO DE FONDO =====================
       playsinline + muted + autoplay: requisito para autoplay sin gesto.
       preload="auto": el archivo es chico (≈3.7 MB) y se cachea entero.
       No hay ningún backdrop-filter encima: eso era lo que trababa la v4. -->
  <video id="bgVideo" autoplay muted loop playsinline preload="auto" disablepictureinpicture>
    <source src="/assets/background.mp4" type="video/mp4">
  </video>
  <div class="scrim"></div>

  <!-- ===================== INTERFAZ EN REPOSO ===================== -->
  <div id="idle" class="idle">
    <div class="stack-top">
      <div id="date" class="date">—</div>
      <div id="clock" class="clock">--:--</div>
    </div>

    <div class="stack-bottom">
      <div class="panel weather" id="weather">
        <div class="w-icon" id="w-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </div>
        <div class="w-main">
          <div class="w-temp" id="w-temp">--°</div>
          <div class="w-desc" id="w-desc">—</div>
        </div>
        <div class="w-side">
          <div class="w-city" id="w-city">Buenos Aires</div>
          <div class="w-range" id="w-range">—</div>
        </div>
      </div>

      <div class="statusline">
        <span class="sdot" id="sdot"></span>
        <span id="slabel">Conectando</span>
      </div>
    </div>
  </div>

  <!-- ===================== LLAMADA ===================== -->
  <div id="call" class="call">
    <div class="call-card">
      <div class="call-head">
        <span class="live"><span class="live-dot"></span>EN VIVO</span>
        <span class="call-title">Centro de Monitoreo</span>
        <span class="call-timer" id="call-timer">00:00</span>
      </div>

      <div class="call-stage" id="call-stage">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="avatar" id="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
          <span>Operador en línea</span>
        </div>
      </div>

      <div class="call-foot">
        <span class="mic-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="22" />
          </svg>
          Hablá normalmente
        </span>
      </div>
    </div>
  </div>
</body>

</html>
