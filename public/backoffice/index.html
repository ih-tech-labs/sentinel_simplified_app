<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sentinel · Centro de Monitoreo</title>
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/vendor/jsmpeg.min.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body>
  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 5.5v6c0 5 3.4 9.2 8 10.5 4.6-1.3 8-5.5 8-10.5v-6L12 2Z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </span>
      <span class="brand-name">SENTINEL</span>
      <span class="brand-sub" id="site-name">C2</span>
    </div>

    <!-- Barra de telemetria -->
    <div class="telemetry" id="telemetry">
      <div class="tele" title="Uso de CPU">
        <span class="tele-k">CPU</span><span class="tele-v" id="m-cpu">--</span>
      </div>
      <div class="tele" title="Temperatura del SoC">
        <span class="tele-k">TEMP</span><span class="tele-v" id="m-temp">--</span>
      </div>
      <div class="tele" title="Memoria en uso">
        <span class="tele-k">RAM</span><span class="tele-v" id="m-ram">--</span>
      </div>
      <div class="tele" title="Almacenamiento">
        <span class="tele-k">DISCO</span><span class="tele-v" id="m-disk">--</span>
      </div>
      <div class="tele" title="Tiempo en línea del servicio">
        <span class="tele-k">UPTIME</span><span class="tele-v" id="m-uptime">--</span>
      </div>
    </div>

    <div class="topbar-right">
      <div class="link-state" id="link-state">
        <span class="pulse"></span><span id="link-label">CONECTANDO</span>
      </div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="user-chip">
        <span id="user-name">--</span>
        <button class="btn-logout" id="btn-logout" title="Cerrar sesión">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Banda de alarma global -->
  <div class="alert-bar" id="alert-bar">
    <span class="alert-bar-dot"></span>
    <span id="alert-bar-text">ALARMA ACTIVA</span>
    <button id="alert-bar-ack">Reconocer todo</button>
  </div>

  <!-- ================= LAYOUT ================= -->
  <main class="layout">

    <!-- --------- Columna de cámaras --------- -->
    <section class="cams" id="cams">
      <div class="section-head">
        <h2>Puestos de Monitoreo</h2>
        <span class="count" id="cam-count">0 activos</span>
      </div>
      <div class="cam-grid" id="cam-grid">
        <!-- Se generan desde app.js a partir de la config del servidor -->
      </div>
    </section>

    <!-- --------- Panel lateral --------- -->
    <aside class="side">

      <!-- Control de dispositivos -->
      <section class="panel">
        <div class="panel-head">
          <h3>Control de Dispositivos</h3>
          <span class="dot-state" id="gpio-state" title="Estado del enlace con Arduino"></span>
        </div>
        <div class="panel-body">
          <div class="preset-grid" id="preset-grid"></div>
          <div class="gpio-feedback" id="gpio-feedback"></div>
        </div>
      </section>

      <!-- Historial -->
      <section class="panel panel-grow">
        <div class="panel-head">
          <h3>Registro de Eventos</h3>
          <div class="panel-actions">
            <span class="badge" id="evt-pending">0</span>
            <button class="btn-mini" id="btn-ack-all" title="Reconocer todos">✓</button>
          </div>
        </div>
        <div class="filters">
          <select id="f-kiosk" aria-label="Filtrar por puesto">
            <option value="all">Todos los puestos</option>
          </select>
          <select id="f-sev" aria-label="Filtrar por tipo">
            <option value="all">Todo tipo</option>
            <option value="alert">Alarmas</option>
            <option value="test">Pruebas</option>
            <option value="info">Sistema</option>
          </select>
        </div>
        <div class="timeline" id="timeline">
          <div class="empty">Sin eventos registrados</div>
        </div>
      </section>

    </aside>
  </main>

  <audio id="alarmAudio" src="/assets/alarm.mp3" preload="auto"></audio>

  <!-- Aviso: los navegadores bloquean audio hasta la primera interacción -->
  <div class="audio-gate" id="audio-gate">
    <button id="audio-gate-btn">Habilitar audio de alarmas</button>
  </div>
</body>

</html>
