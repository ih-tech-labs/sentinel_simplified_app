<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Backoffice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://jsmpeg.com/jsmpeg.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">SENTINEL</div>
            <div class="status-badge offline" id="kiosk-status">OFFLINE</div>
        </header>

        <!-- Main Content -->
        <main>
            <div class="grid-container multi-kiosk">
                <!-- CARD 1: ADMINISTRACIÓN -->
                <div class="kiosk-card" id="card-admin">
                    <div class="card-header">
                        <span class="kiosk-name">ADMINISTRACIÓN</span>
                        <div class="status-dot offline" id="status-admin"></div>
                    </div>

                    <!-- RTSP Player Container -->
                    <div class="video-wrapper">
                        <canvas id="canvas-admin" class="rtsp-canvas"></canvas>
                        <div class="overlay-msg">Conectando...</div>
                    </div>

                    <!-- Controls -->
                    <div class="card-footer">
                        <button class="btn-call idle" onclick="selectKiosk('admin')">
                            <span class="icon">📞</span> LLAMAR
                        </button>
                        <button class="btn-test-mini" onclick="testAlarm('admin')">🔔 Test</button>
                    </div>
                </div>

                <!-- CARD 2: HOUSE TENIS -->
                <div class="kiosk-card" id="card-tenis">
                    <div class="card-header">
                        <span class="kiosk-name">HOUSE TENIS</span>
                        <div class="status-dot offline" id="status-tenis"></div>
                    </div>

                    <!-- RTSP Player Container -->
                    <div class="video-wrapper">
                        <canvas id="canvas-tenis" class="rtsp-canvas"></canvas>
                        <div class="overlay-msg">Conectando...</div>
                    </div>

                    <!-- Controls -->
                    <div class="card-footer">
                        <button class="btn-call idle" onclick="selectKiosk('tenis')">
                            <span class="icon">📞</span> LLAMAR
                        </button>
                        <button class="btn-test-mini" onclick="testAlarm('tenis')">🔔 Test</button>
                    </div>
                </div>
            </div>

            <!-- Active Call Modal (Hidden by default) -->
            <div id="call-modal" class="hidden">
                <div class="call-content">
                    <h2>En llamada con: <span id="call-target-name">...</span></h2>
                    <video id="localVideo" autoplay playsinline muted class="mirror"></video>
                    <audio id="remoteAudio" autoplay></audio>

                    <div class="call-controls">
                        <button id="btn-end-call" class="btn-danger">FINALIZAR</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer / Controls -->
        <!-- Alarm Audio (Hidden) -->
        <audio id="alarmAudio" src="/assets/alarm.mp3" preload="auto"></audio>
    </div>

    <script src="backoffice.js"></script>
</body>

</html>
