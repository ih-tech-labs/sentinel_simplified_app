<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Backoffice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://jsmpeg.com/jsmpeg.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">SENTINEL</div>


        </header>

        <!-- Main Content -->
        <main>
            <div class="grid-container multi-kiosk">
                <!-- CARD 1: ADMINISTRACIÓN -->
                <div class="kiosk-card" id="card-admin">
                    <div class="card-header">
                        <span class="kiosk-name">ADMINISTRACIÓN</span>
                        <div class="status-badge offline" id="status-admin">OFFLINE</div>
                    </div>

                    <!-- RTSP Player Container -->
                    <div class="video-wrapper">
                        <canvas id="canvas-admin" class="rtsp-canvas"></canvas>
                        <div class="overlay-msg">Conectando...</div>
                    </div>

                    <!-- Controls -->
                    <div class="card-footer">
                        <button class="btn-call idle" onclick="selectKiosk('admin')">
                            <span class="icon">📞</span> LLAMAR
                        </button>
                        <button class="btn-test-mini" onclick="testAlarm('admin')">🔔 Test</button>
                    </div>
                </div>

                <!-- CARD 2: HOUSE TENIS -->
                <div class="kiosk-card" id="card-tenis">
                    <div class="card-header">
                        <span class="kiosk-name">HOUSE TENIS</span>
                        <div class="status-badge offline" id="status-tenis">OFFLINE</div>
                    </div>

                    <!-- RTSP Player Container -->
                    <div class="video-wrapper">
                        <canvas id="canvas-tenis" class="rtsp-canvas"></canvas>
                        <div class="overlay-msg">Conectando...</div>
                    </div>

                    <!-- Controls -->
                    <div class="card-footer">
                        <button class="btn-call idle" onclick="selectKiosk('tenis')">
                            <span class="icon">📞</span> LLAMAR
                        </button>
                        <button class="btn-test-mini" onclick="testAlarm('tenis')">🔔 Test</button>
                    </div>
                </div>
                <!-- Global Media Controls (Moved from Header) -->
                <div class="global-controls">
                    <button id="btn-global-mute" class="btn-ctrl active" title="Silenciar">
                        <!-- SVG Mic -->
                        <svg class="ctrl-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 2.34 9 5v6c0 1.66 1.34 3 3 3z" />
                            <path
                                d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                        </svg>
                    </button>
                    <button id="btn-global-cam" class="btn-ctrl active" title="Cámara">
                        <!-- SVG Cam -->
                        <svg class="ctrl-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M15 8v8H5V8h10m1-2H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4V7c0-.55-.45-1-1-1z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- PiP Container (Moved dynamically) -->
            <div id="pip-container" class="hidden">
                <video id="localVideo" autoplay playsinline muted></video>
                <!-- Person Logo Overlay -->
                <div class="logo-overlay hidden">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                </div>
            </div>
        </main>

        <!-- Footer / Controls -->
        <!-- Alarm Audio (Hidden) -->
        <audio id="alarmAudio" src="/assets/alarm.mp3" preload="auto"></audio>
        <!-- Remote Audio -->
        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script src="backoffice.js"></script>
</body>

</html>
