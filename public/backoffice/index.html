<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Backoffice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/jsmpeg.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">SENTINEL</div>
            <div class="status-badge offline" id="kiosk-status">OFFLINE</div>
        </header>

        <!-- Main Content -->
        <main>
            <div class="grid-container">
                <!-- Local Camera Preview -->
                <div class="panel video-panel">
                    <div class="panel-header">TRANSMISIÓN</div>
                    <div class="video-wrapper">
                        <video id="localVideo" autoplay playsinline muted class="mirror"></video>
                        <div class="avatar-placeholder">
                            <svg viewBox="0 0 24 24" fill="none" class="avatar-icon">
                                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5" />
                                <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- RTSP / Audio Panel -->
                <div class="panel rtsp-panel">
                    <div class="panel-header">
                        <span>CÁMARA REMOTA</span>
                        <button id="btn-config-rtsp" class="btn-icon-small" title="Configurar Cámara">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path
                                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                                </path>
                            </svg>
                        </button>
                    </div>
                    <div class="rtsp-wrapper">
                        <canvas id="rtsp-canvas"></canvas>
                        <!-- Audio is played via WebRTC usually, but RTSP has audio too. 
                             We keep remoteAudio hidden for the Call Audio (intercom), 
                             as RTSP audio might be delayed or unwanted. 
                             Actually, user wants to REPLACE audio panel. 
                             We still need the intercom audio from the Kiosk microphone!
                             So we keep remoteAudio hidden. -->
                        <audio id="remoteAudio" autoplay style="display:none;"></audio>
                    </div>
                </div>
            </div>
        </main>

        <!-- RTSP Config Modal -->
        <div id="config-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Configurar Cámara RTSP</h3>
                <input type="text" id="rtsp-url-input" placeholder="rtsp://usuario:pass@ip:554/stream"
                    spellcheck="false">
                <div class="modal-actions">
                    <button id="btn-cancel-config" class="btn-text">Cancelar</button>
                    <button id="btn-save-config" class="btn-primary-small">Guardar</button>
                </div>
            </div>
        </div>

        <!-- Footer / Controls -->
        <footer>
            <div class="controls-wrapper">

                <!-- Secondary Controls (Left) -->
                <div class="sec-controls">
                    <button id="btn-mute" class="btn-icon" title="Mutear Micrófono" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button id="btn-cam" class="btn-icon" title="Apagar Cámara" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                            </path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </button>
                </div>

                <!-- Main Action (Center) -->
                <div class="main-control">
                    <button id="btn-toggle-call" class="btn-toggle idle">
                        <span class="btn-text">INICIAR LLAMADA</span>
                    </button>
                </div>

                <!-- Spacer (Right) to balance flex -->
                <div class="spacer"></div>

            </div>
        </footer>
    </div>

    <script src="backoffice.js"></script>
</body>

</html>
