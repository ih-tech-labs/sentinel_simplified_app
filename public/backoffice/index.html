<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Backoffice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div class="brand">
                <span class="dot-brand"></span> SENTINEL
            </div>
            <div class="status">
                <span id="kiosk-status" class="offline">OFFLINE</span>
            </div>
        </header>

        <main>
            <div class="video-grid">
                <!-- Local Preview -->
                <div class="video-card large">
                    <div class="video-wrapper">
                        <video id="localVideo" autoplay playsinline muted class="mirror"></video>
                        <div class="label">TRANSMISIÓN (CAM 01)</div>
                    </div>
                </div>

                <!-- Remote Audio -->
                <div class="audio-card">
                    <div class="label">AUDIO RECEPCIÓN</div>
                    <div id="audio-visualizer">
                        <div class="wave"></div>
                        <div class="wave"></div>
                        <div class="wave"></div>
                        <div class="wave"></div>
                        <div class="wave"></div>
                    </div>
                    <!-- Hidden audio element for playback -->
                    <audio id="remoteAudio" autoplay></audio>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-container">
                <div class="main-action">
                    <button id="btn-toggle-call" class="btn-main idle" title="Iniciar Transmisión">
                        <div class="icon-wrapper">
                            <span class="icon">📡</span>
                        </div>
                        <span class="text" id="toggle-text">INICIAR</span>
                    </button>
                </div>

                <div class="secondary-actions">
                    <button id="btn-mute" class="btn-sec" title="Microfono" disabled>
                        <span>🎤</span>
                    </button>
                    <button id="btn-cam" class="btn-sec" title="Camara" disabled>
                        <span>📷</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="backoffice.js"></script>
</body>

</html>
