<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Backoffice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>SENTINEL <span style="font-weight:600; color:white">BACKOFFICE</span></h1>
            <div class="status">Estado: <span id="kiosk-status" class="offline">Desconectado</span></div>
        </header>

        <main>
            <div class="video-grid">
                <!-- Local Preview -->
                <div class="video-card">
                    <h3>MI CÁMARA</h3>
                    <video id="localVideo" autoplay playsinline muted></video>
                </div>

                <!-- Remote Audio Viz -->
                <div class="video-card">
                    <h3>KIOSK AUDIO</h3>
                    <div id="audio-visualizer">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                    <!-- Hidden audio element for playback -->
                    <audio id="remoteAudio" autoplay></audio>
                </div>
            </div>

            <!-- Controls (Bottom Bar) -->
            <div class="control-bar">
                <button id="btn-call" class="btn-call" title="Iniciar Llamada">📞</button>
                <button id="btn-hangup" class="btn-hangup" title="Cortar Llamada" disabled>📴</button>
                <div style="width: 1px; background: #444; margin: 0 10px;"></div> <!-- Separator -->
                <button id="btn-mute" class="btn-active" title="Mutear Micrófono" disabled>🎙️</button>
                <button id="btn-cam" class="btn-active" title="Apagar Cámara" disabled>📷</button>
            </div>
        </main>
    </div>

    <script src="backoffice.js"></script>
</body>

</html>
