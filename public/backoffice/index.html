<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Backoffice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">SENTINEL</div>
            <div class="status-badge offline" id="kiosk-status">OFFLINE</div>
        </header>

        <!-- Main Content -->
        <main>
            <div class="grid-container">
                <!-- Local Camera Preview -->
                <div class="panel video-panel">
                    <div class="panel-header">TRANSMISIÓN</div>
                    <div class="video-wrapper">
                        <video id="localVideo" autoplay playsinline muted class="mirror"></video>
                        <div class="placeholder-text">Cámara Inactiva</div>
                    </div>
                </div>

                <!-- Remote Audio Visualizer -->
                <div class="panel audio-panel">
                    <div class="panel-header">AUDIO RECEPCIÓN</div>
                    <div id="audio-visualizer">
                        <!-- Bars generated by CSS/JS -->
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                    <audio id="remoteAudio" autoplay></audio>
                </div>
            </div>
        </main>

        <!-- Footer / Controls -->
        <footer>
            <div class="controls-wrapper">

                <!-- Secondary Controls (Left) -->
                <div class="sec-controls">
                    <button id="btn-mute" class="btn-icon" title="Mutear Micrófono" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button id="btn-cam" class="btn-icon" title="Apagar Cámara" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                            </path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </button>
                </div>

                <!-- Main Action (Center) -->
                <div class="main-control">
                    <button id="btn-toggle-call" class="btn-toggle idle">
                        <span class="btn-text">INICIAR LLAMADA</span>
                    </button>
                </div>

                <!-- Spacer (Right) to balance flex -->
                <div class="spacer"></div>

            </div>
        </footer>
    </div>

    <script src="backoffice.js"></script>
</body>

</html>
